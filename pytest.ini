[pytest]
norecursedirs = tmp.* build benchmark _site OLD
addopts = -p no:warnings
[pytest]
norecursedirs = tmp.* build benchmark _site OLD
addopts = -p no:warnings
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = 
 tests/basic
 tests/tools
 tests/coders
 tests/subagents
 tests/conversations
 tests/helpers/monorepo
 tests/helpers/observations
 tests/hooks
 tests/mcp
 tests/help
 tests/browser
 tests/unit
 tests/scrape

env =
 CECLI_TUI=false
